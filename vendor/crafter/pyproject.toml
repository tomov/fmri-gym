[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "crafter-gym"
version = "0.1.0"
description = "Crafter as a Gymnasium env."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gymnasium", "numpy", "crafter"]

[tool.setuptools]
packages = ["crafter_gym"]
