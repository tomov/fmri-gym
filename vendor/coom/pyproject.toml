[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "coom-gym"
version = "0.1.0"
description = "COOM's Doom scenarios as a Gymnasium env, without the COOM package."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gymnasium", "numpy", "vizdoom"]

[tool.setuptools]
packages = ["coom_gym"]
