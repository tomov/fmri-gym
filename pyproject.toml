[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fmri-gym"
version = "0.1.0"
description = "One fMRI experiment framework for (almost) any Gymnasium-compatible game."
readme = "README.md"
# nle>=1.3 needs >=3.10. The ceiling is what the backends ship wheels for, and
# uv/pip pick the newest interpreter a project allows: nle and box2d have no
# cp314 wheels, so <3.14 keeps a fresh env off a Python that would have to
# compile them. No .python-version needed -- this bound binds pip too.
requires-python = ">=3.10,<3.14"
# The core is engine-agnostic (session, display, keys, logging). Backends are
# extras below ("install what you need"); adapters import their engine lazily,
# so a missing extra only bites the curriculum that names it.
dependencies = [
    "gymnasium",
    # vizdoom depends on pygame-ce; baba and gymnasium[box2d] on classic
    # pygame, and the two overwrite each other's `pygame` module.
    # Naming pygame-ce here makes the outcome independent of install order.
    "pygame-ce",
    "sounddevice",
    "numpy",
    "h5py",  # the rendered frames of a block recording
    "setuptools<81",  # minihack imports pkg_resources
]

[project.optional-dependencies]
ale = ["ale-py"]
retro = ["stable-retro"]
# crafter, baba and the VGDL fork speak the old `gym` API (or their own); each
# gets a thin Gymnasium env under gym/ (see tool.uv.sources), which is what
# the extra installs, and which pulls the game itself in.
crafter = ["crafter-gym"]
baba = ["baba-gym"]
# Baba Is Auto: Baba Is You's levels on the baba-is-auto C++ engine, compiled at install time from the
# external/baba_auto checkout (README "External checkouts"; needs a C++17
# compiler and python3-dev).
baba_auto = ["baba-auto-gym"]
vgdl = ["vgdl-gym"]  # the games come from the external/vgdl checkout (language_and_experience)
# nle>=1.3 is what ships wheels for current Pythons; without the floor a
# resolver may prefer gymnasium 1.3 and fall back to nle 0.9.1 (source build).
minihack = ["minihack", "nle>=1.3", "minihack-levels"]
nethack = ["nle>=1.3"]
# The ten browser games as a gym env, from gym/aigamestore (see tool.uv.sources).
aigamestore = ["aigamestore-gym"]
# ARC-AGI-3 games, run offline by the arc-agi toolkit (Python >= 3.12), from gym/arc3 (see
# tool.uv.sources). The games' files are fetched once (README "ARC-AGI-3 games").
arc3 = ["arc3-gym; python_version >= '3.12'"]
vizdoom = ["vizdoom"]
# COOM scenarios as a gym env, from gym/coom (see tool.uv.sources). Needs the
# external/coom checkout too; the COOM package itself is not installed.
coom = ["coom-gym"]
rushhour = ["rushhour-gym>=0.7.0"]
# SuperTuxKart, game included. The wheel is pure Python; it fetches the
# game and a trimmed asset pack (254 MiB) from the matching GitHub release on
# first use, into ~/.cache/supertuxkart-gym. Linux x86_64 only for now, and it
# needs a real GL display, because the observation is the game's own rendering.
# The pack is tied to the package version, so upgrading the pin is the whole
# update procedure; STK_ENV_BIN overrides the binary it fetched.
stk = ["supertuxkart-gym>=0.1.3"]
# `gym` backend families beyond classic_control / toy_text (which ship with gymnasium):
# `Box2D` is the module gymnasium's box2d envs import. gymnasium[box2d] would
# get it from box2d-py, an sdist-only 2018 release that must compile (swig +
# a C++ compiler) and fails to on many machines; `box2d` ships wheels.
box2d = ["box2d>=2.3.10"]
mujoco = ["gymnasium[mujoco]"]  # run with MUJOCO_GL=egl headless
shimmy = ["shimmy"]  # old-`gym` envs via "legacy_gym": true
tilematch = ["tile-match-gym"]  # display + logging only
# MEG/EEG trigger backends (README "Triggers"): `triggers.backend` lsl / serial / parallel.
triggers = ["pylsl", "pyserial", "pyparallel"]
# The fmri-edit config editor. Essentials is the widgets half of PySide6 (LGPL),
# without the WebEngine/3D add-ons, which would triple the download.
gui = ["PySide6-Essentials>=6.6"]

# The DBP picks (docs/DBP_FINAL_LIST.md). Not installable from an index and
# therefore not listed: craftium (prebuilt wheel on its GitHub releases) and
# the VGDL games (a repo checkout on PYTHONPATH; see README "Running VGDL games").
dbp = [
    "fmri-gym[vizdoom,coom,aigamestore,crafter,rushhour,baba,minihack,stk]",
]
all = [
    "fmri-gym[dbp,ale,retro,nethack,vgdl,baba_auto,arc3,box2d,mujoco,shimmy,tilematch,triggers,gui]",
]

[project.scripts]
fmri-play = "fmri_play:main"
# The config editor (the `gui` extra). Separate from fmri-play, which only ever
# plays one run: what Play starts there is an fmri-play command like any other.
fmri-edit = "fmri_gym.gui:main"
# The next free session number for a subject: a session script's first line, so
# all of its runs land in one session. Nothing else reads the disk for a number.
fmri-ses = "fmri_gym.bids:main"
# Measure this rig's controller once and write ~/.config/fmri-gym/pad.json, which
# every run then reads. A pad's stick neither rests at 0 nor reaches 1 both ways,
# so the numbers have to be measured per machine rather than assumed.
fmri-pad-calibrate = "fmri_gym.pad:calibrate_main"
# Watch the pad live -- what it sends, and what pad.py makes of it. Opens on its
# own after a calibration, so the numbers are looked at before they are trusted.
fmri-pad-scope = "fmri_gym.pad:scope_main"

[tool.setuptools]
packages = ["fmri_gym", "fmri_gym.adapters"]
py-modules = ["fmri_play"]

[tool.uv]
# A never-true marker on classic `pygame`, so it is never installed and
# pygame-ce (an API-compatible superset) owns the `pygame` module alone.
override-dependencies = ["pygame; sys_platform == 'pygame-ce-only'"]

[tool.uv.sources]
minihack-levels = { path = "gym/minihack", editable = true }
aigamestore-gym = { path = "gym/aigamestore", editable = true }
coom-gym = { path = "gym/coom", editable = true }
baba-gym = { path = "gym/baba", editable = true }
baba-auto-gym = { path = "gym/baba_auto", editable = true }
crafter-gym = { path = "gym/crafter", editable = true }
vgdl-gym = { path = "gym/vgdl", editable = true }
arc3-gym = { path = "gym/arc3", editable = true }

[tool.ruff]
line-length = 100
